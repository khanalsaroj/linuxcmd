name: Question
description: Ask a usage or design question
title: "[QUESTION]: "
labels: ["question"]

body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish? Relevant command(s), config, or environment details.
    validations:
      required: false
